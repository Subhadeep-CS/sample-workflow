name: Sequential Job Execution
on: push
jobs:
  validate-file:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4
      - name: Validate html
        run: test -f index.html
      - name: Validate js
        run: test -f script.js
  validate-code:
    needs: [validate-file]
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4
      - name: Validate html code
        run: npx htmlhint index.html
      - name: validate js code
        run: node --check script.js
