name: Validate File
on: push
jobs:
  validate-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4
      - name: Validate Html
        run: test -f index.html
      - name: Validate Javascript
        run: test -f script.js
      - name: Validate Javascript Code
        run: node --check script.js
